          - Developed a CALPHAD-informed phase-field framework for LPBF grain prediction and Gaussian-process surrogate models achieving approximately 100x acceleration.
          - Built multiscale battery-manufacturing models coupling particle-resolved structure, heat and mass transport, fluid flow, and binder migration.
          - Developed FFT crystal-plasticity/phase-field and COMSOL multiphysics models for metallic microstructure evolution and solid-state batteries.

