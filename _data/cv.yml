cv:
  name: Xinxin Yao
  label: Computational Scientist | Physics-Based Modeling | AI for Advanced Manufacturing
  email: yaoxinx@umich.edu
  phone: "+1 734-596-1600"
  location: Ann Arbor, Michigan, USA
  image: ""
  summary: >-
    Computational scientist and mechanical engineer specializing in physics-based modeling, multiphysics simulation, scientific computing, and AI-accelerated engineering. I develop predictive simulation frameworks that connect manufacturing process, microstructure, and material performance, with applications in lithium-ion battery manufacturing and metal additive manufacturing. My work combines Fortran, Python, MATLAB, COMSOL, LAMMPS, CFD-DEM, phase-field methods, CALPHAD, crystal plasticity, and Gaussian-process surrogate modeling. Author or co-author of 29 peer-reviewed publications with experience spanning university research, national-laboratory collaboration, and industrial R&D.

  social_networks:
    - network: LinkedIn
      username: xinxin-yao
    - network: GitHub
      username: sutato

  sections:
    Experience:
      - company: University of Michigan-Dearborn
        position: Assistant Research Scientist, Mechanical Engineering
        location: Dearborn, Michigan, USA
        start_date: 2026-08
        end_date: present
        highlights:
          - Lead development of multiscale and multiphysics computational frameworks for battery manufacturing, additive manufacturing, and computational materials science.
          - Integrate particle-resolved simulation, continuum heat and mass transport, phase-field modeling, CALPHAD, crystal plasticity, and machine-learning surrogate models into predictive engineering workflows.
          - Translate manufacturing conditions into quantitative process-microstructure-performance relationships for process optimization and digital-twin applications.
          - Collaborate across academia, industry, and national laboratories on federally sponsored advanced-manufacturing research.

      - company: University of Michigan-Dearborn
        position: Postdoctoral Researcher, Mechanical Engineering
        location: Dearborn, Michigan, USA
        start_date: 2023-06
        end_date: 2026-08
        highlights:
          - Developed a CALPHAD-informed phase-field framework for LPBF grain-structure prediction and integrated Gaussian-process classification/regression to accelerate thermodynamic evaluations by approximately 100x under the DARPA SURGE program.
          - Built a multiscale battery-electrode manufacturing framework coupling particle-resolved modeling, heat transfer, fluid flow, mass transport, binder migration, and three-dimensional microstructure evolution.
          - Integrated machine learning with physics-based simulations to predict the effect of particle-resolved 3D electrode microstructures on battery discharge behavior.
          - Built an FFT-based crystal-plasticity/phase-field framework in Fortran and MATLAB to model recrystallization and gradient-grained microstructure evolution.
          - Developed COMSOL multiphysics models for conductive alignment and ultrasonic healing in solid-state batteries in collaboration with experimental teams.

      - company: General Motors Technical Center, Research & Development
        position: Research Intern
        location: Warren, Michigan, USA
        start_date: 2024-01
        end_date: 2025-09
        highlights:
          - Developed coarse-grained molecular-dynamics models in LAMMPS to predict cathode-electrode microstructure evolution and debonding during drying.
          - Developed coupled fluid-flow, heat-transfer, and mass-diffusion models in COMSOL to quantify polymer-binder migration and optimize electrode drying conditions.
          - Connected simulation predictions with manufacturing experiments and process conditions in an industry R&D environment.
          - Contributed to a GM internal invention, peer-reviewed publications, conference work, and additional manuscript development.

      - company: Dalian University of Technology
        position: Ph.D. Researcher
        location: Dalian, Liaoning, China
        start_date: 2018-09
        end_date: 2022-06
        highlights:
          - Developed particle-aware phase-field models for laser powder bed fusion to investigate process-microstructure relationships and grain evolution.
          - Built coupled CFD-DEM frameworks to quantify nozzle effects on powder flow, particle transport, and laser-energy attenuation in directed energy deposition.
          - Established laser-particle interaction heat-source models to predict melt-pool geometry and thermal history in LPBF.
          - Developed OpenMP-parallelized Fortran code for large-scale 3D heterogeneous nucleation and grain-growth simulations.

    Research Impact:
      - name: Battery Manufacturing
        summary: Multiscale modeling of electrode processing, drying, binder migration, and microstructure evolution.
        highlights:
          - Developed CGMD and multiphysics workflows connecting drying conditions to electrode structure and binder distribution.
          - Collaborated with General Motors Technical Center and Pacific Northwest National Laboratory on DOE-supported battery-manufacturing research.
          - Published battery-manufacturing research in Chemical Engineering Journal, Journal of Materials Processing Technology, and related venues.

      - name: Additive Manufacturing & Digital Twins
        summary: Physics-based and AI-accelerated prediction of solidification, grain structure, and process-structure relationships.
        highlights:
          - Developed CALPHAD-informed phase-field models for SS316L LPBF under the DARPA SURGE program.
          - Built Gaussian-process surrogate models that reduced thermodynamic evaluation cost by approximately two orders of magnitude.
          - Developed phase-field, CFD-DEM, and laser-particle interaction models across LPBF and directed energy deposition.

      - name: Computational Materials & Scientific AI
        summary: Development of reusable computational frameworks that combine mechanistic modeling with data-driven acceleration.
        highlights:
          - Coupled FFT crystal plasticity with phase-field modeling for recrystallization and gradient-grained materials.
          - Applied Gaussian process regression/classification, uncertainty quantification, and physics-aware surrogate modeling.
          - Developed scientific software in Fortran, Python, MATLAB, and multiphysics platforms for research-scale simulation.

