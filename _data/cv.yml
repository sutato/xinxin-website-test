          - Heat, mass, and solvent transport
          - Process optimization and experimental validation

      - name: DARPA SURGE — Metallic Endurance Digital Twin
        summary: Physics-based and AI-accelerated prediction of SS316L LPBF microstructure for digital-twin and materials-data applications.
        highlights:
          - CALPHAD-informed phase-field modeling
          - Gaussian-process classification and regression
          - Approximately 100x acceleration of thermodynamic evaluations

