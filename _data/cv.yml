        position: Research Intern
        location: Warren, Michigan, USA
        start_date: 2024-01
        end_date: 2025-09
        highlights:
          - Developed coarse-grained molecular-dynamics models in LAMMPS for cathode-electrode microstructure evolution and debonding during drying.
          - Developed coupled COMSOL models for fluid flow, heat transfer, solvent transport, and polymer-binder migration in electrode manufacturing.
          - Connected simulation predictions with manufacturing experiments and contributed to publications and intellectual property.

    Selected Research Programs:
      - name: DOE HPC4EI — Battery Electrode Drying
        summary: Multiscale simulation of battery electrode drying and binder migration in collaboration with General Motors Technical Center and Pacific Northwest National Laboratory.
        highlights:
