cv:
  name: Xinxin Yao
  label: Computational Scientist | Multiphysics & Numerical Modeling
  email: yaoxinx@umich.edu
  phone: "+1 734-596-1600"
  location: Ann Arbor, Michigan, USA
  image: ""
  summary: >-
    Computational scientist and mechanical engineer developing physics-based numerical models for advanced manufacturing and materials systems. Expertise in multiphysics simulation, scientific computing, numerical methods, parallel computing, model validation, battery manufacturing, and metal additive manufacturing. Experienced in translating fundamental physics into predictive engineering tools using Fortran, MATLAB, Python, COMSOL, LAMMPS, CFD, DEM, phase-field methods, CALPHAD, and machine-learning surrogate models.

  social_networks:
    - network: LinkedIn
      username: xinxin-yao
    - network: GitHub
      username: sutato

  sections:
    Experience:
      - company: University of Michigan–Dearborn
        position: Assistant Research Scientist, Mechanical Engineering
        location: Dearborn, Michigan, USA
        start_date: 2026
        end_date: present
        highlights:
          - Develop multiscale and multiphysics computational frameworks for battery manufacturing and metal additive manufacturing.
          - Integrate particle-resolved simulation, continuum transport, phase-field modeling, CALPHAD, scientific computing, and physics-informed machine learning.
          - Develop process–structure–property models and computational acceleration strategies for engineering design and manufacturing optimization.

      - company: University of Michigan
        position: Postdoctoral Researcher
        location: Michigan, USA
        start_date: 2023-06
        end_date: 2026
        highlights:
          - Integrated machine-learning models with physics-based simulations to predict how particle-resolved 3D electrode microstructures affect lithium-battery discharge behavior using Python, EDEM, and COMSOL.
          - Developed a double-electric-layer model to investigate conductive alignment in solid-state battery cathodes.
          - Developed an FFT-based crystal-plasticity/phase-field framework to simulate recrystallization and gradient-grained microstructure evolution using Fortran and MATLAB.
          - Developed a multiphysics model for ultrasonic healing in solid-state batteries using COMSOL.
          - Developed a CALPHAD-informed phase-field framework for LPBF grain-structure prediction and Gaussian-process surrogate models achieving approximately 100x acceleration under the DARPA SURGE program.

      - company: General Motors Technical Center, Research & Development
        position: Research Intern
        location: Warren, Michigan, USA
        start_date: 2024-01
        end_date: 2025-09
        highlights:
          - Developed coarse-grained molecular dynamics models for microstructure evolution and debonding in water-based cathode electrodes using LAMMPS.
          - Developed coupled fluid-flow, heat-transfer, and mass-diffusion models to study polymer-binder migration and optimize electrode drying conditions using COMSOL.
          - Contributed to a GM internal invention, peer-reviewed publications, conference work, and manufacturing-focused computational modeling workflows.

      - company: Dalian University of Technology
        position: Ph.D. Researcher
        location: Dalian, Liaoning, China
        start_date: 2018-09
        end_date: 2022-06
        highlights:
          - Developed phase-field models for laser powder bed fusion incorporating metal-powder particle characteristics to study process–microstructure relationships.
          - Developed coupled CFD–DEM frameworks to quantify nozzle effects on powder flow and laser-energy attenuation in directed energy deposition.
          - Established particle-aware LPBF heat-source models to predict melt-pool size and thermal history.
          - Developed OpenMP-based Fortran phase-field code for 3D heterogeneous nucleation and grain-growth simulations.

